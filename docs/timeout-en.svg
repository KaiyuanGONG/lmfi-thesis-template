<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d">
<title id="t">If Overleaf times out</title><desc id="d">Overleaf says timed out. 1. Stay in Overleaf: turn the examples off and compile fewer chapters. If it still times out: 2. TeXstudio with MiKTeX on Windows or MacTeX on macOS, or 3. VS Code with LaTeX Workshop and TeX Live.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker></defs>
<rect x="10" y="95" width="150" height="60" rx="12" fill="#FFF4E5" stroke="#E3B341"/>
<text x="85" y="119" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">Overleaf:</text>
<text x="85" y="141" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F2328">timed out</text>
<line x1="162" y1="125" x2="196" y2="125" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<rect x="200" y="75" width="250" height="100" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<circle cx="228" cy="105" r="14" fill="#138A36"/>
<text x="228" y="110" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
<text x="252" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1F2328">Stay in Overleaf</text>
<text x="218" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">examples off,</text>
<text x="218" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">compile fewer chapters</text>
<line x1="452" y1="125" x2="490" y2="125" stroke="#8C959F" stroke-width="2"/>
<line x1="490" y1="60" x2="490" y2="190" stroke="#8C959F" stroke-width="2"/>
<line x1="490" y1="60" x2="586" y2="60" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="190" x2="586" y2="190" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606A">still</text>
<text x="500" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#57606A">timed out?</text>
<rect x="590" y="10" width="280" height="100" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<circle cx="618" cy="40" r="14" fill="#138A36"/>
<text x="618" y="45" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
<text x="642" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1F2328">TeXstudio</text>
<text x="608" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">+ MiKTeX (Windows)</text>
<text x="608" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">or MacTeX (macOS)</text>
<rect x="590" y="140" width="280" height="100" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
<circle cx="618" cy="170" r="14" fill="#138A36"/>
<text x="618" y="175" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<text x="642" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1F2328">VS Code</text>
<text x="608" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">+ LaTeX Workshop</text>
<text x="608" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#57606A">+ TeX Live</text>
</svg>
